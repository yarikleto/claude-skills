<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-label="@yarikleto/claude-skills">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1320"/>
      <stop offset="55%" stop-color="#2b1d3a"/>
      <stop offset="100%" stop-color="#3a1f2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8a5c"/>
      <stop offset="100%" stop-color="#d96a8e"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9f6e"/>
      <stop offset="100%" stop-color="#d9633d"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b985ff"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6fd9ff"/>
      <stop offset="100%" stop-color="#4aa8d9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8a5c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff8a5c" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <circle cx="300" cy="180" r="260" fill="url(#glow)"/>

  <g opacity="0.18" stroke="#ffffff" stroke-width="1" fill="none">
    <path d="M0 300 Q 320 220 640 300 T 1280 300"/>
    <path d="M0 260 Q 320 180 640 260 T 1280 260"/>
    <path d="M0 220 Q 320 140 640 220 T 1280 220"/>
  </g>

  <g transform="translate(200 180)">
    <g transform="rotate(-10)">
      <rect x="-120" y="-80" width="160" height="160" rx="22" fill="url(#card3)" opacity="0.85"/>
    </g>
    <g transform="rotate(0)">
      <rect x="-90" y="-90" width="180" height="180" rx="24" fill="url(#card2)" opacity="0.92"/>
    </g>
    <g transform="rotate(10)">
      <rect x="-60" y="-100" width="200" height="200" rx="26" fill="url(#card1)"/>
      <path d="M -10 -30 L 10 -30 L 4 -6 L 26 -6 L -6 34 L 0 6 L -18 6 Z"
            fill="#ffffff" opacity="0.95"/>
    </g>
  </g>

  <g transform="translate(480 150)" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif">
    <text x="0" y="0" font-size="22" font-weight="500" letter-spacing="4" opacity="0.65">CLAUDE  CODE  PLUGIN</text>
    <text x="0" y="56" font-size="64" font-weight="700" letter-spacing="-1">
      <tspan opacity="0.7">@yarikleto</tspan><tspan>/</tspan><tspan fill="url(#accent)">claude-skills</tspan>
    </text>
    <text x="0" y="108" font-size="24" font-weight="400" opacity="0.75">A personal collection of skills for Claude Code.</text>

    <g transform="translate(0 148)" font-size="18" opacity="0.8">
      <rect x="0" y="-22" width="150" height="32" rx="16" fill="#ffffff" opacity="0.08"/>
      <text x="18" y="-1">⚡ electron-debug</text>
      <rect x="164" y="-22" width="120" height="32" rx="16" fill="#ffffff" opacity="0.08"/>
      <text x="182" y="-1">+ more soon</text>
    </g>
  </g>

  <g opacity="0.9">
    <circle cx="1130" cy="70"  r="2.5" fill="#fff"/>
    <circle cx="1180" cy="120" r="1.8" fill="#fff"/>
    <circle cx="1220" cy="70"  r="1.2" fill="#fff"/>
    <circle cx="1090" cy="110" r="1.2" fill="#fff"/>
    <circle cx="1160" cy="40"  r="1.5" fill="#fff"/>
    <circle cx="1210" cy="160" r="1.5" fill="#fff"/>
  </g>
</svg>
